name: Publish

# The impure, secret-bearing release path, independent of CI. It builds its own
# APK (a cache hit from CI's identical build when available), so it has no
# dependency on the CI workflow — only its own trigger.
on:
  push:
    branches: [main, canary]
  # Nightly promotion: drag canary forward to main's current build so canary can
  # never silently lag behind, even if no one pushes it. A scheduled run checks
  # out the default branch (main), so the build is main's HEAD; the stream step
  # below republishes it as canary. Backed by the same "canary ≥ main" gate.
  # Off-peak minute on purpose: scheduled runs share a queue and the top of the
  # hour is the most contended slot, so an odd minute starts closer to on-time.
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, early morning.

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      R2_ENDPOINT: https://28e45df51086264c6d9cf2b5e6ecc190.r2.cloudflarestorage.com
      R2_BUCKET: hearthd-assets
      PUBLIC_BASE: https://assets.hearthd.dev
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Full history so the canary safety gate can resolve origin/main.
        with:
          fetch-depth: 0

      - name: Determine stream & canary safety gate
        id: stream
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # Nightly run: promote main's build to the canary stream.
            stream="canary"
          else
            stream="$GITHUB_REF_NAME"
          fi
          # Never ship a canary that's missing commits already on main.
          if [ "$stream" = "canary" ] && ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::canary is not a descendant of main; refusing to publish."
            exit 1
          fi
          echo "stream=$stream" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main

      # Enter the flake's CI dev shell once, exporting its tools (apksigner,
      # aapt2, awscli2, …) into the environment of every later step. Keeps all
      # CI tooling on this flake's pinned nixpkgs instead of a rolling registry.
      - name: Enter CI dev shell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: .#ci

      - name: Build & sign the release APK
        run: |
          out=$(nix build .#hearthd-kiosk --no-link --print-out-paths)
          mkdir -p artifacts
          cp "$out"/*.apk artifacts/
          chmod -R u+w artifacts
          apk=$(ls artifacts/*.apk | head -1)
          bash ci/sign-apk.sh "$apk" "$apk.signed"
          mv "$apk.signed" "$apk"
          bash ci/apk-version.sh "$apk" apk-version.env

      - name: Publish to R2
        run: |
          set -a; . ./apk-version.env; set +a
          apk=$(ls artifacts/*.apk | head -1)
          VERSION_CODE="$versionCode" VERSION_NAME="$versionName" \
            bash ci/publish.sh "$apk" "${{ steps.stream.outputs.stream }}"
